name: MediBook CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore MediBook
      run: dotnet restore AppointmentSystem.Web/MediBook.csproj

    - name: Build MediBook
      run: dotnet build AppointmentSystem.Web/MediBook.csproj --no-restore

    - name: Run unit tests
      run: dotnet test Medibook.Tests/Medibook.Tests.csproj --verbosity normal

    - name: Publish MediBook
      run: dotnet publish AppointmentSystem.Web/MediBook.csproj -c Release -o ./publish

    - name: Deploy to Azure
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'MediBook'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish