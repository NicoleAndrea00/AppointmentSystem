name: MediBook CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore MediBook
      run: dotnet restore AppointmentSystem.Web/MediBook.csproj

    - name: Build MediBook
      run: dotnet build AppointmentSystem.Web/MediBook.csproj --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test Medibook.Tests/Medibook.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Publish MediBook
      run: dotnet publish AppointmentSystem.Web/MediBook.csproj --configuration Release --output ./publish

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: medibook-publish
        path: ./publish

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'MediBook'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish

    - name: Wait for Azure app startup
      run: sleep 60

    - name: OWASP ZAP Baseline Security Scan
      if: github.ref == 'refs/heads/main'
      uses: zaproxy/action-baseline@v0.12.0
      continue-on-error: true
      with:
        target: 'http://medibook.health'
        fail_action: false
        cmd_options: '-I'
